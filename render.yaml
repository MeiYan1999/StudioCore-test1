services:
  - type: web
    name: studiocore-meiyan1999
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://studiocore-meiyan1999.onrender.com
      - key: UPLOAD_ROOT
        value: /app/data/uploads
      - key: STORAGE_PROVIDER
        value: local
      - key: SEED_DEMO
        value: "true"
    disk:
      name: studiocore-data
      mountPath: /app/data
      sizeGB: 1
