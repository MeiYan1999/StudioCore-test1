services:
  - type: web
    name: studiocore-test1
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://studiocore.io.vn
      - key: UPLOAD_ROOT
        value: /app/data/uploads
      - key: STORAGE_PROVIDER
        value: local
      - key: SEED_DEMO
        value: "false"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: studiocore-data
    disk:
      name: studiocore-data
      mountPath: /app/data
      sizeGB: 1
