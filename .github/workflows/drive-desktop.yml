name: StudioCore Drive desktop

on:
  push:
    tags: ["drive-v*"]
  pull_request:
    paths: ["desktop-app/**", ".github/workflows/drive-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: studiocore-drive-${{ matrix.os }}
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/drive-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Add stable download names
        run: |
          version="${GITHUB_REF_NAME#drive-v}"
          cp "artifacts/StudioCore-Drive-${version}-win-x64.exe" artifacts/StudioCore-Drive-win-x64.exe
          cp "artifacts/StudioCore-Drive-${version}-mac-arm64.dmg" artifacts/StudioCore-Drive-mac-arm64.dmg
          cp "artifacts/StudioCore-Drive-${version}-mac-x64.dmg" artifacts/StudioCore-Drive-mac-x64.dmg
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "StudioCore Drive ${GITHUB_REF_NAME#drive-v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
